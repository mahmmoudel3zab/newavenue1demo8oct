<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#121417">
<title>New Avenue</title>
<meta name="application-name" content="New Avenue">
<meta name="apple-mobile-web-app-title" content="New Avenue">
<meta name="description" content="New Avenue — internal sales platform for New Avenue Real Estate Consultancy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<!-- Loaded in dependency order. These are classic (non-module) scripts, so they
     all share one global scope, exactly like the original single-file version. -->
<!-- Set window.NA1_API_BASE here before api.js loads to point at a deployed backend,
     e.g. <script>window.NA1_API_BASE = 'https://api.example.com/api';</script>
     Defaults to http://localhost:4000/api when unset.
     For a REAL deployment also add:  window.NA1_SHOW_DEMO_ACCOUNTS = false;  (hides the demo account list). -->
<!-- App mode switch ('full' = real backend, 'demo' = static preview with sample data). See js/app-mode.js. -->
<script src="js/app-mode.js"></script>
<script src="js/api.js"></script>
<script src="js/demo-mode.js"></script>
<script src="js/data.js"></script>
<script src="js/sync.js"></script>
<script src="js/icons.js"></script>
<script src="js/session.js"></script>
<script src="js/shell.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/leads.js"></script>
<script src="js/pages/inventory.js"></script>
<script src="js/pages/myunits.js"></script>
<script src="js/pages/requests.js"></script>
<script src="js/pages/owners.js"></script>
<script src="js/pages/reference.js"></script>
<script src="js/pages/notifications.js"></script>
<script src="js/pages/dailyreport.js"></script>
<script src="js/pages/admin.js"></script>
<script src="js/pages/profile.js"></script>
<!-- PART 6 FIX (navigation/stuck-screen audit): this file defines renderAnnouncementsPage /
     AFTER_RENDER.announcements, referenced by shell.js's page router, but was missing from this
     load order entirely. Without it, opening Company Announcements (from Head of HR's own nav
     item, or from the notification any other employee gets when one is sent) threw
     "renderAnnouncementsPage is not defined" and left that screen blank with no way back other
     than the sidebar/tabbar — a real pre-existing bug, not something introduced this round. -->
<script src="js/pages/announcements.js"></script>
<script src="js/app.js"></script>
</body>
</html>
